name: render
# Renders every new/changed jobs/<id>.json into a Reel and publishes it as the
# release "<id>" (assets: <id>.mp4, <id>-cover.jpg, <id>-sheet.jpg, render-log.txt).
# Public video URL: https://github.com/<owner>/<repo>/releases/download/<id>/<id>.mp4
on:
  push:
    paths: ['jobs/*.json']
  workflow_dispatch:
    inputs:
      job:
        description: 'Job file to render, e.g. jobs/2026-10-09-spain-rent.json'
        required: true
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0 > /dev/null
          pip install --quiet pillow numpy faster-whisper "yt-dlp[default]" kokoro-onnx soundfile
          yt-dlp --version
          ffmpeg -version | head -1
          python3 -c "from PIL import features; print('raqm:', features.check('raqm'))"
      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-v1.0
      - name: Get Kokoro voice model
        run: |
          mkdir -p ~/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s ~/kokoro/kokoro-v1.0.onnx ] || curl -sSL -o ~/kokoro/kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -s ~/kokoro/voices-v1.0.bin ] || curl -sSL -o ~/kokoro/voices-v1.0.bin $base/voices-v1.0.bin
          ls -la ~/kokoro
      - name: Pick jobs
        id: jobs
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then
            list="${{ github.event.inputs.job }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then before="HEAD~1"; fi
            list=$(git diff --name-only --diff-filter=AM "$before" HEAD -- 'jobs/*.json' | tr '\n' ' ')
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "jobs: $list"
      - name: Render and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for job in ${{ steps.jobs.outputs.list }}; do
            id=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "$job")
            dir="out/$id"; mkdir -p "$dir"
            status=ok
            if python3 -c "import json,sys; sys.exit(0 if 'find' in json.load(open(sys.argv[1])) else 1)" "$job"; then
              # media search job: results in find.txt, no video
              python3 tools/find_media.py "$job" "$dir" > "$dir/find.txt" 2>&1 || status=failed
              tail -60 "$dir/find.txt"
              gh release delete "$id" --yes --cleanup-tag > /dev/null 2>&1 || true
              gh release create "$id" "$dir"/* --title "$id ($status)" --notes "Media search for $job" --latest=false
              continue
            fi
            # free voiceover (Kokoro) when the job asks for "voice": {"tts": "kokoro"}
            python3 tools/tts.py "$job" "$dir" "out/$id.job.json" > "$dir/render-log.txt" 2>&1 || status=failed
            if [ "$status" = ok ]; then
              python3 render/reel.py "out/$id.job.json" "$dir/$id.mp4" >> "$dir/render-log.txt" 2>&1 || status=failed
            fi
            if [ "$status" = ok ]; then
              ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate \
                -of json "$dir/$id.mp4" > "$dir/probe.json"
              dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$dir/$id.mp4")
              ffmpeg -v error -y -i "$dir/$id.mp4" -vf "fps=12/$dur,scale=270:-1,tile=6x2:padding=6:color=0x202020" \
                -frames:v 1 "$dir/$id-sheet.jpg"
              ffmpeg -v error -y -ss 0.5 -i "$dir/$id.mp4" -frames:v 1 -q:v 2 "$dir/$id-cover.jpg"
              ffmpeg -hide_banner -nostats -i "$dir/$id.mp4" -af ebur128=peak=true -f null - 2>&1 \
                | sed -n '/Summary:/,$p' >> "$dir/render-log.txt"
            fi
            tail -20 "$dir/render-log.txt"
            gh release delete "$id" --yes --cleanup-tag > /dev/null 2>&1 || true
            gh release create "$id" "$dir"/* --title "$id ($status)" --notes "Render $status for $job" --latest=false
            [ "$status" = ok ] || echo "::error::render failed for $job"
          done
